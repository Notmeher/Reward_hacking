# Monitors read sweep transcripts (detectors only, never a training reward).
extends: base.yaml
run_name: monitor_v1
source_runs: [sweep_frontier, sweep_open]
select:
  exploit_only: true
  max_hack: 100         # weighted samples of hack/attempt and clean episodes
  max_nonhack: 100
  seed: 0
views: [cot, action]

# ~400 calls, expected ~$1-2; calls beyond max_usd (worst-case estimate) are dropped before submitting.
monitors:
  - name: haiku55-monitor
    provider: anthropic
    model: claude-haiku-5-5
    max_tokens: 1500
    effort: low
    batch: true           # Message Batches API: ~50% cheaper, results within 24h, resumable
    price: {input: 1.0, output: 5.0}
    max_usd: 4
