# Monitors read sweep transcripts (detectors only, never a training reward).
extends: base.yaml
run_name: monitor_v1
source_runs: [sweep_frontier, sweep_open]
select:
  exploit_only: true
  max_hack: 100         # weighted samples of hack/attempt and clean episodes
  max_nonhack: 100
  seed: 0
views: [cot, action]

# Up to 400 calls (~$2-4). Direct calls rather than the Batch API so results arrive within the session.
monitors:
  - name: haiku55-monitor
    provider: anthropic
    model: claude-haiku-5-5
    max_tokens: 2000
    effort: low
    concurrency: 8
