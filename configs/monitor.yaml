# Monitors read sweep transcripts (detectors only, never a training reward).
extends: base.yaml
run_name: monitor_v1
source_runs: [sweep_frontier, sweep_open]
select:
  exploit_only: true
  max_nonhack: 1500     # all hack/attempt episodes + a weighted sample of clean ones
  seed: 0
views: [cot, action]

monitors:
  - name: gpt5-monitor
    provider: azure
    deployment: gpt-5
    params: {reasoning_effort: low, max_completion_tokens: 4000}
    concurrency: 16
  - name: sonnet55-monitor
    provider: anthropic
    model: claude-sonnet-5-5
    max_tokens: 4000
    effort: low
    batch: true           # Message Batches API: ~50% cheaper, results within 24h, resumable
  - name: haiku55-monitor
    provider: anthropic
    model: claude-haiku-5-5
    max_tokens: 2000
    effort: low
    batch: true
