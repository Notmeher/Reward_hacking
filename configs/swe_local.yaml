# Phase 2 (local Mac, Docker): SWE-bench Verified with the frontier models. Run only when ready:
#   uv sync --extra swe
#   uv run rh swe-preflight -c configs/swe_local.yaml
#   uv run rh swe-pull -c configs/swe_local.yaml
#   uv run rh sweep -c configs/swe_local.yaml --limit 2      # smoke test
run_name: swe_local
max_usd: 10           # GPT-5 only: 8 tasks x 2 budgets x 2 exploit settings = 32 episodes
tasks_file: tasks/swe_tasks.jsonl
tasks:
  seed: 0
  eval_frac: 0.0
  swebench: {per_difficulty: 2}      # 2 per fix-time bucket (4 buckets)

env:
  cmd_timeout: 120
  output_limit: 6000
  max_nudges: 1
  act_timeout: 900
  swe:
    # Docker Hub images are x86_64 (emulated on Apple Silicon). For native arm64 images built with
    # the swebench harness use: image_template: "sweb.eval.arm64.{iid_lower}:latest" and platform: null
    image_template: "swebench/sweb.eval.x86_64.{iid_1776}:latest"
    platform: linux/amd64
    memory: 6g
    eval_timeout: 1800

models:
  - name: gpt5
    provider: azure
    deployment: gpt-5
    params: {reasoning_effort: medium, max_completion_tokens: 8000}
    price: {input: 1.25, output: 10.0}
    concurrency: 2
  # Claude costs ~3x more per SWE episode; does not fit the $60 budget.
  # - name: sonnet55
  #   provider: anthropic
  #   model: claude-sonnet-5-5
  #   max_tokens: 8000
  #   thinking: {type: adaptive, display: summarized}
  #   effort: medium
  #   price: {input: 3.0, output: 15.0}
  #   concurrency: 2

grid:
  budget_calls: [5, 15]
  exploit: [none, editable_tests]
  disclosure: [disclosed]
  framing: [eval]
  abstain: [false]
  seeds: 1
