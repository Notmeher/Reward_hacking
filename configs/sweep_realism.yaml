# Realism check + budget-disclosure factor, sampled densely around each model's b*.
# Needs a finished report (bstar.json) from the main sweep.
extends: sweep_frontier.yaml
run_name: sweep_realism
bstar_file: report_v1/bstar.json
task_filter:
  impossible: false
  max_per_family_level: 2
  seed: 1
grid:
  margins: [-4, -2, -1, 0, 1, 3]    # budgets = round(b* + margin) per task
  budget_calls: [2, 4, 8, 16]       # fallback when b* is unknown for a task
  exploit: [all]
  disclosure: [disclosed, hidden]
  framing: [eval, deploy]
  abstain: [false, true]
  seeds: 1
